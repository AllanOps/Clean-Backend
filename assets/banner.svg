<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="clean-backend — backend practices that keep production boring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171B22"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F2A93B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="280" fill="url(#bg)"/>
  <rect width="1280" height="3" fill="url(#edge)"/>

  <!-- layer mark: a backend stack; the top layer (amber) is the one under load -->
  <g>
    <rect x="96" y="103" width="78" height="21" rx="5" fill="#F2A93B"/>
    <rect x="96" y="130" width="78" height="21" rx="5" fill="#E7EBF1" fill-opacity="0.82"/>
    <rect x="96" y="157" width="78" height="21" rx="5" fill="#69727F"/>
  </g>

  <!-- wordmark -->
  <text x="206" y="150"
        font-family="'SF Mono','SFMono-Regular',ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace"
        font-size="72" font-weight="700" letter-spacing="-2" fill="#ECEFF3">clean-backend</text>

  <!-- descriptor -->
  <text x="208" y="192"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="24" font-weight="400" letter-spacing="0.4" fill="#9AA4B2">Production-hardening backend practices</text>
</svg>
