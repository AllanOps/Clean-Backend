version: 2
updates:
  # Keep the SHA-pinned GitHub Actions fresh. Grouped into one weekly PR so
  # pin bumps arrive together, and prefixed `ci` so they don't trigger a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before bumping, so we never adopt a
    # freshly-published (possibly compromised) action tag on day zero.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
