version: 2
updates:
  # Keep the SHA-pinned GitHub Actions fresh. Grouped into one weekly PR so
  # pin bumps arrive together, and prefixed `ci` so they don't trigger a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
