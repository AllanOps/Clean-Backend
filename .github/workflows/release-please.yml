name: Release Please

# On every push to main, release-please maintains a release PR: it updates
# CHANGELOG.md, bumps the version in .claude-plugin/plugin.json (via the json
# extra-file in release-please-config.json), and — when that PR is merged —
# tags the release and publishes a GitHub Release.
#
# Token: a fine-grained PAT stored as secrets.RELEASE_PLEASE_TOKEN (Contents +
# Pull requests, read/write, this repo only). A PAT is required because a PR
# opened with the default GITHUB_TOKEN does NOT trigger other workflows, so the
# release PR would sit with zero checks against a branch ruleset that requires
# them. If you ever remove the PAT, swap in ${{ secrets.GITHUB_TOKEN }} and
# manually close+reopen each release PR to kick off its CI.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
