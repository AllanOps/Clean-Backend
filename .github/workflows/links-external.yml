name: External Links

# External link rot surfaces as a red scheduled run (the maintainer is
# notified), and never blocks a contributor's PR. Internal links and anchors
# are checked on every PR by ci.yml instead.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-external
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Self-referential badge/action URLs 404 until the workflows and first
          # release land on the default branch; exclude them so a fresh repo
          # doesn't report itself as broken. 429 = rate-limited, not dead.
          args: "--include-fragments --accept '200..=299,429' --exclude 'https://github.com/AllanOps/Clean-Backend/(actions|releases)' --exclude 'https://img.shields.io/github/v/release/' '**/*.md'"
          fail: true
